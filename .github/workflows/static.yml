# Deploy only .github/blogs to GitHub Pages
name: Deploy Blog Pages

on:
  push:
    branches: ["main"]

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # Create a temporary directory containing only
      # .github/blogs while preserving the directory structure.
      - name: Prepare blog artifact
        run: |
          mkdir -p _site/.github
          cp -R .github/blogs _site/.github/

      - name: Upload blog artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
